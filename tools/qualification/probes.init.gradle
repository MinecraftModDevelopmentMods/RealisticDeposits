gradle.afterProject { project, state ->
    if (project == project.rootProject && state.failure == null) {
        def lapisInput = project.tasks.register('lapisQualificationProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/LapisRuntimeProbe*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/LapisHarvestRuntimeChecks*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/LapisSurveyProbe*.class'
            archiveFileName = 'lapis-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def lapisPackaged = project.renamer.classes(lapisInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/lapis-probe.jar')
        }
        project.tasks.register('prepareLapisQualification') {
            group = 'verification'
            description = 'Builds the isolated lapis placement and survey probes.'
            dependsOn lapisPackaged
        }

        def goldInput = project.tasks.register('goldQualificationProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/GoldRuntimeProbe*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/GoldGravelRuntimeChecks*.class'
            archiveFileName = 'gold-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def goldPackaged = project.renamer.classes(goldInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/gold-probe.jar')
        }
        project.tasks.register('prepareGoldQualification') {
            group = 'verification'
            description = 'Builds the isolated gold deposit server probe.'
            dependsOn goldPackaged
        }
        def goldSurveyInput = project.tasks.register('goldSurveyProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/GoldSurveyProbe*.class'
            archiveFileName = 'gold-survey-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def goldSurveyPackaged = project.renamer.classes(goldSurveyInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/gold-survey.jar')
        }
        project.tasks.register('prepareGoldSurvey') {
            group = 'verification'
            description = 'Builds the isolated gold reserve and river survey.'
            dependsOn goldSurveyPackaged
        }
        def goldClientInput = project.tasks.register('goldClientProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/client/GoldClientProbe*.class'
            archiveFileName = 'gold-client-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def goldClientPackaged = project.renamer.classes(goldClientInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/gold-client.jar')
        }
        project.tasks.register('prepareGoldClient') {
            group = 'verification'
            description = 'Builds the isolated gold gravel client checks.'
            dependsOn goldClientPackaged
        }

        def surveyInput = project.tasks.register('diamondSurveyProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/DiamondSurveyProbe*.class'
            archiveFileName = 'diamond-survey-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def surveyPackaged = project.renamer.classes(surveyInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/diamond-survey.jar')
        }
        project.tasks.register('prepareDiamondSurvey') {
            group = 'verification'
            description = 'Builds the isolated area-weighted diamond reward survey.'
            dependsOn surveyPackaged
        }
        def diamondInput = project.tasks.register('diamondQualificationProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/DiamondRuntimeProbe*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/DiamondGravelRuntimeChecks*.class'
            archiveFileName = 'diamond-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def diamondPackaged = project.renamer.classes(diamondInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/diamond-probe.jar')
        }
        project.tasks.register('prepareDiamondQualification') {
            group = 'verification'
            description = 'Builds the isolated diamond deposit server probe.'
            dependsOn diamondPackaged
        }
        def input = project.tasks.register('policyQualificationProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/PolicyQualificationProbe*.class'
            archiveFileName = 'policy-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }

        def packaged = project.renamer.classes(input) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/policy-probe.jar')
        }

        project.tasks.register('preparePolicyQualification') {
            group = 'verification'
            description = 'Builds the isolated packaged-server policy probe.'
            dependsOn packaged
        }

        def coalInput = project.tasks.register('coalQualificationProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/CoalRuntimeProbe*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/MineWorkingsRuntimeProbe*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/PipeWorkingsRuntimeChecks*.class'
            archiveFileName = 'coal-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def coalPackaged = project.renamer.classes(coalInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/coal-probe.jar')
        }
        project.tasks.register('prepareCoalQualification') {
            group = 'verification'
            description = 'Builds the isolated coalfield server probe.'
            dependsOn coalPackaged
        }

        def coalUpgradeInput = project.tasks.register('coalUpgradeProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/CoalUpgradeProbe*.class'
            archiveFileName = 'coal-upgrade-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def coalUpgradePackaged = project.renamer.classes(coalUpgradeInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/coal-upgrade-probe.jar')
        }
        project.tasks.register('prepareCoalUpgradeQualification') {
            group = 'verification'
            description = 'Builds the old/new coal upgrade fixture without new product API links.'
            dependsOn coalUpgradePackaged
        }

        def mineInput = project.tasks.register('mineQualificationProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/MineWorkingsRuntimeProbe*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/PipeWorkingsRuntimeChecks*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/GoldWorkingsRuntimeChecks*.class'
            include 'zone/moddev/mc/realisticdeposits/generation/LapisWorkingsRuntimeChecks*.class'
            archiveFileName = 'mine-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }

        def minePackaged = project.renamer.classes(mineInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/mine-probe.jar')
        }

        def frozenInput = project.tasks.register('frozenMineProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/FrozenMineRuntimeProbe*.class'
            archiveFileName = 'frozen-mine-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }
        def frozenPackaged = project.renamer.classes(frozenInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/frozen-mine-probe.jar')
        }

        def oldTerrainInput = project.tasks.register('legacyMineProbeInput', Jar) {
            dependsOn project.tasks.named('testClasses')
            from project.sourceSets.test.output.classesDirs
            include 'zone/moddev/mc/realisticdeposits/generation/MineLegacyTerrainProbe*.class'
            archiveFileName = 'legacy-mine-probe-deobf.jar'
            destinationDirectory = project.layout.buildDirectory.dir('qualification')
        }

        def oldTerrainPackaged = project.renamer.classes(oldTerrainInput) {
            map.from project.minecraft.dependency.toSrgFile
            output = project.layout.buildDirectory.file('qualification/legacy-mine-probe.jar')
        }

        project.tasks.register('prepareMineQualification') {
            group = 'verification'
            description = 'Builds the isolated abandoned-mine server probe.'
            dependsOn minePackaged
            dependsOn frozenPackaged
            dependsOn oldTerrainPackaged
        }
    }
}
