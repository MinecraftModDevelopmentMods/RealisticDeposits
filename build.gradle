import org.apache.tools.ant.filters.FixCrLfFilter

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.renamer' version '1.1.5'
    id 'net.minecraftforge.gradle' version '7.0.34'
}

group = project.mod_group
version = project.mod_version
base.archivesName = 'RealisticDeposits'

def versionParts = project.mod_version.toString().tokenize('.')
if (versionParts.size() != 4 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException("mod_version must use Major.Minor.Bug.Target numeric form: ${project.mod_version}")
}

def minecraftParts = project.minecraft_version.toString().tokenize('.')
if (minecraftParts.size() != 3 || !minecraftParts.every { it ==~ /\d+/ }) {
    throw new GradleException("minecraft_version must use major.minor.patch numeric form: ${project.minecraft_version}")
}
def expectedTarget = "${minecraftParts[0]}" \
        + "${minecraftParts[1].padLeft(2, '0')}" \
        + "${minecraftParts[2].padLeft(2, '0')}" \
        + project.loader_code
if (versionParts[3] != expectedTarget) {
    throw new GradleException("mod_version target ${versionParts[3]} does not match "
            + "Minecraft ${project.minecraft_version} ${project.loader_name} target ${expectedTarget}")
}

Properties localProperties = new Properties()
File localPropertiesFile = file('local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
String oreSpawnLocalPath = System.getenv('ORESPAWN_LOCAL_JAR')
        ?: localProperties.getProperty('orespawn.local.jar')
if (oreSpawnLocalPath == null || oreSpawnLocalPath.trim().isEmpty()) {
    throw new GradleException('Set ORESPAWN_LOCAL_JAR or orespawn.local.jar in ignored local.properties '
            + 'to the exact local OreSpawn 4.1.0.110021 candidate')
}
File oreSpawnLocalJar = file(oreSpawnLocalPath).canonicalFile
if (!oreSpawnLocalJar.isFile()) {
    throw new GradleException("Local OreSpawn candidate does not exist: ${oreSpawnLocalJar}")
}
String oreSpawnLocalDeobfPath = System.getenv('ORESPAWN_LOCAL_DEOBF_JAR')
        ?: localProperties.getProperty('orespawn.local.deobf.jar')
if (oreSpawnLocalDeobfPath == null || oreSpawnLocalDeobfPath.trim().isEmpty()) {
    throw new GradleException('Set ORESPAWN_LOCAL_DEOBF_JAR or orespawn.local.deobf.jar in ignored '
            + 'local.properties to the matching mapped OreSpawn development jar')
}
File oreSpawnLocalDeobfJar = file(oreSpawnLocalDeobfPath).canonicalFile
if (!oreSpawnLocalDeobfJar.isFile()) {
    throw new GradleException("Mapped local OreSpawn candidate does not exist: ${oreSpawnLocalDeobfJar}")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addBooleanOption('notimestamp', true)
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def archiveTextPatterns = [
        '**/*.cfg', '**/*.css', '**/*.html', '**/*.java', '**/*.js',
        '**/*.json', '**/*.lang', '**/*.mcmeta', '**/*.md',
        '**/*.properties', '**/*.txt', '**/*.xml',
        '**/element-list', '**/package-list'
]
def normalizeArchiveLineEndings = { details ->
    details.filter(FixCrLfFilter,
            eol: FixCrLfFilter.CrLf.newInstance('lf'),
            eof: FixCrLfFilter.AddAsisRemove.newInstance('asis'))
}

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    // Packaged Forge applies OreSpawn's SRG transformer. ForgeGradle's mapped
    // development runtime needs the same two rules in mapped form; this input
    // is deliberately outside main resources and is never shipped by this mod.
    accessTransformer.from(file('gradle/orespawn-development-access-transformer.cfg'))
    String configuredRunDirectory = providers.gradleProperty('realisticDepositsRunDirectory')
            .getOrElse('run')

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir(configuredRunDirectory)
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'realisticDeposits.topologyProbe',
                    providers.gradleProperty('realisticDepositsTopologyProbe').getOrElse('false')
        }
        register('client')
        register('server') {
            // Forge 1.10 accepts the literal argument, without a leading '--'.
            args 'nogui'
        }
    }
}

// Forge 1.10 expects classes and resources beneath one development-mod root.
// Keep canonical Gradle outputs separate and create a merged launch-only root.
def forge10DevelopmentOutput = layout.buildDirectory.dir('forge10-development/main')
def syncForge10DevelopmentResources = tasks.register('syncForge10DevelopmentResources', Sync) {
    group = 'ide'
    dependsOn tasks.named('classes')
    from tasks.named('compileJava', JavaCompile).flatMap { it.destinationDirectory }
    from sourceSets.main.output.resourcesDir
    into forge10DevelopmentOutput
}
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn syncForge10DevelopmentResources
        doFirst {
            Set<File> splitMainOutputs = [
                    tasks.named('compileJava', JavaCompile).get().destinationDirectory.get().asFile,
                    sourceSets.main.output.resourcesDir
            ] as Set<File>
            classpath = files(forge10DevelopmentOutput, classpath.filter {
                !splitMainOutputs.contains(it)
            })
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    // Slime Launcher contributes the vanilla 1.10 manifest's LWJGL 2.9.1
    // libraries ahead of ForgeGradle's selected 2.9.4 runtime unless the
    // target LWJGL line is also a direct Eclipse project dependency. The red
    // launch loaded that older core immediately before the 256x256 panorama
    // viewport/GL 1281 failure. Keep this aligned with the green OreSpawn and
    // Mineralogy 1.10 launches.
    compileOnly 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
    // Development is deliberately pinned to the exact local OreSpawn 4.1 API
    // candidate. There is no fallback to a released 4.0.x artifact.
    implementation files(oreSpawnLocalDeobfJar)

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property('version', project.version)
    inputs.property('mcversion', project.minecraft_version)
    inputs.property('orespawnVersionRange', project.orespawn_version_range)

    filesMatching('mcmod.info') {
        expand version: project.version,
                mcversion: project.minecraft_version,
                orespawnVersionRange: project.orespawn_version_range
    }
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

def prepareEclipseResources = tasks.register('prepareEclipseResources') {
    group = 'ide'
    description = 'Copies processed production resources into Eclipse output.'
    dependsOn tasks.named('processResources')
    doLast {
        project.copy {
            from(layout.buildDirectory.dir('resources/main'))
            into(layout.projectDirectory.dir('bin/main'))
        }
    }
}

eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
    synchronizationTasks 'isolateEclipseProductionRuns'
}

tasks.register('configureEclipseBuildship') {
    group = 'ide'
    description = 'Creates local Buildship preferences for the shared Gradle cache.'
    doLast {
        File preferencesFile = file('.settings/org.eclipse.buildship.core.prefs')
        Properties preferences = new Properties()
        [
                'eclipse.preferences.version'    : '1',
                'connection.gradle.distribution': 'GRADLE_DISTRIBUTION(WRAPPER)',
                'connection.gradle.user.home'   : gradle.gradleUserHomeDir.canonicalPath,
                'connection.project.dir'        : '',
                'gradle.user.home'               : gradle.gradleUserHomeDir.canonicalPath,
                'override.workspace.settings'   : 'true'
        ].each { key, value -> preferences.setProperty(key, value) }
        preferencesFile.parentFile.mkdirs()
        preferencesFile.withOutputStream {
            preferences.store(it, 'Generated by Realistic Deposits Buildship setup.')
        }
    }
}

tasks.register('isolateEclipseProductionRuns') {
    group = 'ide'
    description = 'Normalizes Slime Launcher paths and marks ordinary Eclipse launches as production-only.'
    dependsOn tasks.named('genEclipseRuns')
    dependsOn tasks.named('configureEclipseBuildship')
    dependsOn prepareEclipseResources
    doLast {
        ['runClient.launch', 'runServer.launch',
         'runTestClient.launch', 'runTestServer.launch'].each { name ->
            File launch = file(name)
            if (!launch.isFile()) {
                throw new GradleException("ForgeGradle did not generate ${name}")
            }
            String contents = launch.getText('UTF-8')

            // Slime Launcher parses this attribute itself rather than receiving
            // Eclipse's already separated argument vector. Quote every path so
            // workspaces such as "RealisticDeposits 110" remain one argument.
            def programArguments = contents =~ /(<stringAttribute key="org\.eclipse\.jdt\.launching\.PROGRAM_ARGUMENTS" value=")([^"]*)("\/>)/
            if (programArguments.count != 1) {
                throw new GradleException("ForgeGradle generated malformed program arguments in ${name}")
            }
            String arguments = programArguments[0][2]
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                String prefix = "--${flag} "
                int valueStart = arguments.indexOf(prefix)
                if (valueStart < 0) {
                    throw new GradleException("ForgeGradle omitted --${flag} from ${name}")
                }
                valueStart += prefix.length()
                int valueEnd = arguments.indexOf(' --', valueStart)
                if (valueEnd < 0) {
                    throw new GradleException("ForgeGradle generated an unterminated --${flag} path in ${name}")
                }
                String value = arguments.substring(valueStart, valueEnd)
                if (!value.startsWith('&quot;') || !value.endsWith('&quot;')) {
                    arguments = "${arguments.substring(0, valueStart)}&quot;${value}&quot;${arguments.substring(valueEnd)}"
                }
            }
            contents = contents.replace(programArguments[0][0],
                    programArguments[0][1] + arguments + programArguments[0][3])

            if ((name == 'runClient.launch' || name == 'runServer.launch')
                    && !contents.contains('org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE')) {
                contents = contents.replace('</launchConfiguration>',
                        '  <booleanAttribute key="org.eclipse.jdt.launching.ATTR_EXCLUDE_TEST_CODE" value="true"/>\n'
                                + '</launchConfiguration>')
            }
            launch.setText(contents.replace('\r\n', '\n'), 'UTF-8')
        }
    }
}

tasks.register('verifyEclipseProductionClasspath') {
    group = 'verification'
    description = 'Verifies ordinary Eclipse launches and processed resources.'
    dependsOn tasks.named('isolateEclipseProductionRuns')
    dependsOn tasks.named('verifyLegacyClientClasspath')
    doLast {
        File processedMetadata = file('bin/main/mcmod.info')
        if (!processedMetadata.isFile()) {
            throw new GradleException('Eclipse output is missing processed mcmod.info')
        }
        String metadata = processedMetadata.getText('UTF-8')
        if (!metadata.contains('"version": "' + project.version + '"')
                || metadata.contains('${version}')) {
            throw new GradleException('Eclipse metadata is not version-expanded')
        }
        ['runClient.launch', 'runServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8').replace('\\', '/')
            ['src/test', 'bin/test', 'build/classes/java/test', 'junit-',
             'opentest4j-', 'junit-platform-'].each { forbidden ->
                if (contents.contains(forbidden)) {
                    throw new GradleException("${name} exposes ${forbidden}")
                }
            }
            if (!contents.contains('ATTR_EXCLUDE_TEST_CODE')
                    || !contents.contains('PROJECT_ATTR" value="RealisticDeposits"')) {
                throw new GradleException("${name} is not a production-only RealisticDeposits launch")
            }
            if (name == 'runServer.launch'
                    && (!contents.contains(' -- nogui"') || contents.contains('--nogui'))) {
                throw new GradleException('Forge 1.10 server launch must use bare nogui')
            }
        }
        ['runClient.launch', 'runServer.launch',
         'runTestClient.launch', 'runTestServer.launch'].each { name ->
            String contents = file(name).getText('UTF-8')
            ['cache', 'metadata', 'to-srg', 'to-obf'].each { flag ->
                if (!contents.contains("--${flag} &quot;")) {
                    throw new GradleException("Eclipse launch does not quote its --${flag} path: ${name}")
                }
            }
        }
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = 'deobf'
    destinationDirectory = layout.buildDirectory.dir('libs-dev')
    manifest {
        attributes([
                'Specification-Title'       : project.mod_name,
                'Specification-Vendor'      : project.mod_authors,
                'Specification-Version'     : versionParts[0],
                'Implementation-Title'      : base.archivesName.get(),
                'Implementation-Version'    : project.version,
                'Implementation-Vendor'     : project.mod_authors,
                'Maven-Artifact'            : "${project.group}:${base.archivesName.get()}:${project.version}",
                'Built-On-Java'             : project.java_version,
                'Built-On'                  : "${project.minecraft_version}-${project.forge_version}"
        ])
    }
}

def releaseJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = null
    output = layout.buildDirectory.file("libs/RealisticDeposits-${project.version}.jar")
}

tasks.named('sourcesJar', Jar) {
    includeEmptyDirs = false
    archiveClassifier = 'sources'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

tasks.named('javadocJar', Jar) {
    archiveClassifier = 'javadoc'
    filesMatching(archiveTextPatterns, normalizeArchiveLineEndings)
}

['apiElements', 'runtimeElements'].each { configurationName ->
    configurations.named(configurationName) {
        artifacts.clear()
    }
    artifacts {
        add(configurationName, releaseJar)
    }
}

tasks.named('assemble') {
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
}

tasks.register('verifyProjectIdentity') {
    group = 'verification'
    dependsOn tasks.named('processResources')
    doLast {
        if (project.mod_id != 'realisticdeposits'
                || project.curseforge_project_slug != 'realisticdeposits'
                || project.mod_group != 'zone.moddev.mc.realisticdeposits') {
            throw new GradleException('Unexpected Realistic Deposits project identity')
        }
        if (project.minecraft_version != '1.10.2'
                || project.forge_version != '12.18.3.2511'
                || project.orespawn_version != '4.1.0.110021') {
            throw new GradleException('Unexpected target or OreSpawn dependency identity')
        }
        if (project.mod_version.toString().contains('-')) {
            throw new GradleException('Version qualifiers are forbidden by the shared numeric policy')
        }
    }
}

tasks.register('verifyLegacyClientClasspath') {
    group = 'verification'
    description = 'Guards the target LWJGL line used by legacy Eclipse client launches.'
    doLast {
        String expectedVersion = '2.9.4-nightly-20150209'
        def directLwjgl = configurations.compileOnly.dependencies.findAll {
            it.group == 'org.lwjgl.lwjgl' && it.name == 'lwjgl_util'
        }
        if (directLwjgl.size() != 1 || directLwjgl[0].version != expectedVersion) {
            throw new GradleException('Eclipse requires one direct lwjgl_util 2.9.4-nightly dependency')
        }

        def resolved = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'org.lwjgl.lwjgl' }
                .collect { "${it.name}:${it.moduleVersion.id.version}" }
                .toSet()
        ['lwjgl', 'lwjgl_util', 'lwjgl-platform'].each { module ->
            if (!resolved.contains("${module}:${expectedVersion}")) {
                throw new GradleException("Compile classpath does not select ${module}:${expectedVersion}: ${resolved}")
            }
        }
        if (resolved.any { !it.endsWith(":${expectedVersion}") }) {
            throw new GradleException("Compile classpath contains a conflicting LWJGL line: ${resolved}")
        }
    }
}

tasks.register('verifyOreSpawnDependency') {
    group = 'verification'
    description = 'Verifies the exact local OreSpawn 4.1 API/runtime and mapped development transformer.'
    doLast {
        File oreSpawnFile = oreSpawnLocalJar
        String actualHash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(oreSpawnFile.bytes).encodeHex().toString().toUpperCase()
        if (actualHash != project.orespawn_sha256) {
            throw new GradleException("Local OreSpawn SHA-256 is ${actualHash}, expected "
                    + project.orespawn_sha256)
        }
        String actualDeobfHash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(oreSpawnLocalDeobfJar.bytes).encodeHex().toString().toUpperCase()
        if (actualDeobfHash != project.orespawn_deobf_sha256) {
            throw new GradleException("Mapped local OreSpawn SHA-256 is ${actualDeobfHash}, expected "
                    + project.orespawn_deobf_sha256)
        }
        java.util.zip.ZipFile archive = new java.util.zip.ZipFile(oreSpawnFile)
        try {
            def apiEntry = archive.getEntry('zone/moddev/mc/orespawn/api/OreGenerationContext.class')
            def providerEntry = archive.getEntry('zone/moddev/mc/orespawn/api/WorldgenProvider.class')
            if (apiEntry == null || providerEntry == null) {
                throw new GradleException('Local OreSpawn candidate is missing the 4.1 extension API')
            }
            def entry = archive.getEntry('META-INF/accesstransformer.cfg')
            if (entry == null) throw new GradleException('Local OreSpawn has no access transformer')
            List<String> releasedRules = archive.getInputStream(entry).getText('UTF-8').readLines()
                    .findAll { !it.trim().isEmpty() }
            List<String> mappedRules = file('gradle/orespawn-development-access-transformer.cfg')
                    .readLines('UTF-8').findAll { !it.trim().isEmpty() }
            if (releasedRules != [
                    'public-f net.minecraft.world.WorldProvider field_76578_c',
                    'public-f net.minecraft.world.gen.ChunkProviderOverworld field_186001_t'
            ] || mappedRules != [
                    'public-f net.minecraft.world.WorldProvider biomeProvider',
                    'public-f net.minecraft.world.gen.ChunkProviderOverworld oceanBlock'
            ]) {
                throw new GradleException('OreSpawn development transformer no longer matches the local candidate')
            }
        } finally {
            archive.close()
        }
    }
}

tasks.register('verifyReleaseArtifacts') {
    group = 'verification'
    description = 'Audits the functional release artifacts and dependency isolation.'
    dependsOn releaseJar
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
    doLast {
        File mainFile = layout.buildDirectory.file("libs/RealisticDeposits-${project.version}.jar")
                .get().asFile
        File sourcesFile = tasks.named('sourcesJar', Jar).get().archiveFile.get().asFile
        File javadocFile = tasks.named('javadocJar', Jar).get().archiveFile.get().asFile
        [mainFile, sourcesFile, javadocFile].each { artifact ->
            if (!artifact.isFile()) throw new GradleException("Missing artifact ${artifact}")
        }

        java.util.zip.ZipFile mainArchive = new java.util.zip.ZipFile(mainFile)
        try {
            Set<String> entries = mainArchive.entries().collect { it.name } as Set<String>
            [
                    'mcmod.info',
                    'pack.mcmeta',
                    'assets/realisticdeposits/defaults/vanilla.json',
                    'assets/realisticdeposits/lang/en_US.lang',
                    'assets/realisticdeposits/textures/logo.png',
                    'zone/moddev/mc/realisticdeposits/RealisticDeposits.class',
                    'zone/moddev/mc/realisticdeposits/client/RealisticDepositsGuiFactory.class',
                    'zone/moddev/mc/realisticdeposits/command/RealisticDepositsCommand.class',
                    'zone/moddev/mc/realisticdeposits/geometry/RegionDepositPlanner.class',
                    'zone/moddev/mc/realisticdeposits/generation/StratiformSeamPattern.class',
                    'zone/moddev/mc/realisticdeposits/integration/OreSpawnIntegration.class',
                    'zone/moddev/mc/realisticdeposits/proxy/ClientProxy.class'
            ].each { required ->
                if (!entries.contains(required)) throw new GradleException("Main jar is missing ${required}")
            }
            entries.each { entry ->
                if (entry.startsWith('zone/moddev/mc/orespawn/')
                        || entry.contains('/test/') || entry.startsWith('org/junit/')) {
                    throw new GradleException("Main jar leaks dependency or test content: ${entry}")
                }
                if (entry.endsWith('.class')) {
                    byte[] bytes = mainArchive.getInputStream(mainArchive.getEntry(entry)).bytes
                    int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                    if (major != 52) {
                        throw new GradleException("${entry} uses class major ${major}, expected 52")
                    }
                }
            }
            String metadata = mainArchive.getInputStream(mainArchive.getEntry('mcmod.info'))
                    .getText('UTF-8')
            if (!metadata.contains('"version": "' + project.version + '"')
                    || metadata.contains('${version}')
                    || !metadata.contains('geologically aware ore deposits powered by MMD OreSpawn')) {
                throw new GradleException('Main jar metadata does not describe the exact functional identity')
            }
            def manifestEntry = mainArchive.getEntry('META-INF/MANIFEST.MF')
            if (manifestEntry == null) throw new GradleException('Main jar has no manifest')
            def manifest = new java.util.jar.Manifest(mainArchive.getInputStream(manifestEntry))
            if (manifest.mainAttributes.getValue('Implementation-Version') != project.version.toString()
                    || manifest.mainAttributes.getValue('Maven-Artifact')
                    != "${project.group}:${base.archivesName.get()}:${project.version}") {
                throw new GradleException('Main jar manifest identity is incorrect')
            }
        } finally {
            mainArchive.close()
        }

        java.util.zip.ZipFile sourcesArchive = new java.util.zip.ZipFile(sourcesFile)
        try {
            Set<String> entries = sourcesArchive.entries().collect { it.name } as Set<String>
            if (!entries.contains('zone/moddev/mc/realisticdeposits/geometry/RegionDepositPlanner.java')
                    || entries.any { it.endsWith('.class') || it.startsWith('zone/moddev/mc/orespawn/') }) {
                throw new GradleException('Sources jar contents are incomplete or contaminated')
            }
        } finally {
            sourcesArchive.close()
        }

        java.util.zip.ZipFile javadocArchive = new java.util.zip.ZipFile(javadocFile)
        try {
            Set<String> entries = javadocArchive.entries().collect { it.name } as Set<String>
            if (!entries.contains('index.html')
                    || entries.any { it.endsWith('.class') || it.startsWith('zone/moddev/mc/orespawn/') }) {
                throw new GradleException('Javadoc jar contents are incomplete or contaminated')
            }
        } finally {
            javadocArchive.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyProjectIdentity')
    dependsOn tasks.named('verifyLegacyClientClasspath')
    dependsOn tasks.named('verifyOreSpawnDependency')
    dependsOn tasks.named('verifyReleaseArtifacts')
}
